[build]
  # Next.js build z pluginem @netlify/plugin-nextjs.
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # EMAIL_FROM to publiczny adres nadawcy (nie sekret) — skaner Netlify i tak
  # traktuje każdą zmienną env jak sekret, więc jawnie go wykluczamy.
  SECRETS_SCAN_OMIT_KEYS = "FRONTEND_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,EMAIL_FROM"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cron dzienny: dosyłanie Dni 2-5 sekwencji powitalnej (Resend).
# 08:00 UTC ~ 09:00-10:00 czasu PL. Dzień 1 wysyła subscribe.js od razu.
[functions."send-sequence"]
  schedule = "0 8 * * *"

# Service worker (Web Push do panelu) - bez cache, żeby aktualizacje wchodziły od razu.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
